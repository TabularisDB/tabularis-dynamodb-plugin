[package]
name = "dynamodb-plugin"
version = "0.1.9"
edition = "2021"
description = "Tabularis driver plugin for AWS DynamoDB"
license = "Apache-2.0"
publish = false

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
# Default features minus the legacy `rustls` one, which pulls in hyper 0.14,
# h2 0.3 and rustls 0.21 (open RUSTSEC advisories). `default-https-client`
# already provides the current rustls + aws-lc HTTPS client.
aws-sdk-dynamodb = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = "1"
base64 = "0.23"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
assert-json-diff = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[[bin]]
name = "dynamodb-plugin"
path = "src/main.rs"

[[bin]]
name = "test_plugin"
path = "src/bin/test_plugin.rs"
